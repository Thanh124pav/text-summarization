# GRPO Training Configuration
model: "qwen2-0.5b"
train_data: "data/sample_train.jsonl"
output_dir: "outputs/grpo"

# Training hyperparameters
num_epochs: 1
batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1e-5

# GRPO specific
num_generations: 4
max_completion_length: 256
max_prompt_length: 512

# Reward function parameters
min_summary_length: 30
max_summary_length: 150
reward_mode: "multiplicative"  # "multiplicative", "multiplicative_style", or "additive"

# LoRA
use_lora: true
lora_r: 16
lora_alpha: 32

# Quantization
load_in_4bit: false
load_in_8bit: false

# Logging
logging_steps: 5
save_steps: 100
report_to: "none"
